<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Received Goods Log</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
    label { font-weight: bold; margin-bottom: 4px; }
    input, select, textarea { padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 12px; background: #0078d4; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:disabled { background: #999; }
  </style>
</head>
<body>

  <h2>Goods Receipt Form</h2>
  <form id="receiptForm">
    <div class="form-group"><label>Date / Time</label><input type="datetime-local" id="dateTime" required></div>
    
    <div class="form-group">
      <label>Customer</label>
      <select id="customer" required>
        <option value="" disabled selected>Select a Customer...</option>
      </select>
    </div>

    <!-- Datalist enables type-ahead searching -->
    <div class="form-group">
      <label>ERP Code (Type to search)</label>
      <input list="erpList" id="erpCode" required placeholder="Type or select ERP Code...">
      <datalist id="erpList"></datalist>
    </div>

    <div class="form-group"><label>Description</label><input type="text" id="description"></div>
    
    <div class="form-group">
      <label>Actual Version</label>
      <select id="actualVersion">
        <option value="" disabled selected>Select a Version...</option>
      </select>
    </div>

    <div class="form-group">
      <label>No. of Pallet(s)</label>
      <select id="palettes"></select>
    </div>

    <div class="form-group">
      <label>No. of Box(es)</label>
      <select id="boxes"></select>
    </div>

    <div class="form-group"><label>Total Qty</label><input type="number" id="totalQty" min="0" required></div>
    <div class="form-group"><label>PO #</label><input type="text" id="poNumber" required></div>
    <div class="form-group"><label>Comments</label><textarea id="comments" rows="3"></textarea></div>
    
    <button type="submit" id="submitBtn">Submit Receipt</button>
  </form>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // REMEMBER TO PASTE YOUR ACTUAL POWER AUTOMATE URL HERE
    const FLOW_URL = "PASTE_YOUR_POWER_AUTOMATE_HTTP_POST_URL_HERE";

    // --- DATA EXTRACTED FROM ItemList.xlsx ---
    const customerList = ["AMP", "ANZ", "ANZ  NZ", "ANZ New Zealand", "CCL", "Citi Commercial", "ING", "Mastercard", "OFINA", "OFina", "Ofina", "Wirex", "Wise", "Youtrip"];
    
    const erpMasterList = ["17-ARTPROOF", "17-AUS.EXP.WIN-ING", "17-AUS.EXP.WIN-MPP", "17-AUS.EXPRESS-ING", "17AMP-AUSEXPWIN-AMP", "17AMP-BRGO_BKA62", "17AMP-BRGO_BKA62V2", "17AMP-BRGO_BLUEPER", "17AMP-BRGO_BLUEPERV2", "17AMP-BRGO_JOINTACCT", "17AMP-BRGO_NAVYBIZ", "17AMP-BRGO_NAVYBIZV2", "17AMP-ENVELOPEAU001", "17ANZNZ_A4Satchel", "17ANZNZ_A5Satchel", "17ANZNZ_CN22ThLabel", "17ANZNZ_Folscap28x38", "17ANZNZ_ICI-Carton", "17ANZNZ_Lnflow34x44", "17ANZ_Burgo_Joint", "17ANZ_Burgo_Joint2", "17ANZ_Burgo_Personal", "17ANZ_Burgo_Personal2", "17ANZ_Burgo_Reissue", "17ANZ_Burgo_Replacement", "17ANZ_Burgo_Replacement2", "17ANZ_IMPRINT_LABEL", "17APCTN-001", "17CCL-MCG17015", "17CL-CS6008812D_082023", "17FREIGHT", "17FREIGHT_AMP", "17ING_IM210A_REGENV", "17ING_OE00036", "17ING_OE00076", "17MASTERCARD-CTN02", "17TFCC-WISE-AUNZ-WOA-CON01", "17TRVLX- CP10758", "17TRVLX- CP10966", "17TRVLX- CP11384", "17TRVLX-CP10330", "17TRVLX-CP10331", "17TRVLX-CP10782", "17TRVLX-CP10816", "17TRVLX-CP10842", "17TRVLX-CP10961", "17TRVLX-CP10963", "17TRVLX-CP10964Vb", "17TRVLX-CP10965", "17TRVLX-CP10968", "17TRVLX-CP10968Vb", "17TRVLX-CP11085Va", "17TRVLX-CP11133Va", "17TRVLX-CP11142", "17TRVLX-CP11143", "17TRVLX-CP11144", "17TRVLX-CP11145", "17TRVLX-CP11146", "17TRVLX-CP11147", "17TRVLX-CP11305", "17TRVLX-CP11305Vb", "17TRVLX-CP11306", "17TRVLX-CP11311Vb", "17TRVLX-CP11311Vd", "17TRVLX-CP11313", "17TRVLX-CP11313Vc", "17TRVLX-CP11329", "17TRVLX-CP11350", "17TRVLX-CP11351", "17TRVLX-CP11353", "17TRVLX-CP11356", "17TRVLX-CP11375", "17TRVLX-CP11376", "17TRVLX-CP11384", "17TRVLX-CP11384Vb", "17TRVLX-CP11441", "17TRVLX-CP11442", "17TRVLX-CP11447", "17TRVLX-CP11451", "17TRVLX-CP11452", "17TRVLX-CP11453", "17TRVLX-CP11454", "17TRVLX-CP11455", "17TRVLX-CP11456", "17TRVLX-CP11468", "17TRVLX-CP11471", "17TRVLX-CP11472", "17TRVLX-CP11504", "17TRVLX-CP11504Vb", "17TRVLX-CP11505", "17TRVLX-CP11505Vb", "17TRVLX-CP11509", "17TRVLX-CP11509Vb", "17TRVLX-CP11510", "17TRVLX-CP11510Vb", "17TRVLX-CP11511", "17TRVLX-CP11     // Add custom versions here if you need them to be specific
    const versionList = ["v1.0", "v2.0", "v2.1", "v3.0", "N/A"];
    // --------------------------------------------------

    // Populate Dropdowns on page load
    window.onload = () => {
      document.getElementById('dateTime').value = new Date().toISOString().slice(0, 16);

      const customerSelect = document.getElementById('customer');
      customerList.forEach(c => customerSelect.add(new Option(c, c)));

      const versionSelect = document.getElementById('actualVersion');
      versionList.forEach(v => versionSelect.add(new Option(v, v)));

      const erpDataList = document.getElementById('erpList');
      erpMasterList.forEach(erp => {
        const opt = document.createElement('option');
        opt.value = erp;
        erpDataList.appendChild(opt);
      });

      const palettesSelect = document.getElementById('palettes');
      const boxesSelect = document.getElementById('boxes');
      for (let i = 0; i <= 100; i++) {
        palettesSelect.add(new Option(i, i));
        boxesSelect.add(new Option(i, i));
      }
    };

    document.getElementById('receiptForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;

      const payload = {
        dateTime: document.getElementById('dateTime').value,
        customer: document.getElementById('customer').value,
        erpCode: document.getElementById('erpCode').value,
        description: document.getElementById('description').value,
        actualVersion: document.getElementById('actualVersion').value,
        noOfPallets: parseInt(document.getElementById('palettes').value || 0, 10),
        noOfBoxes: parseInt(document.getElementById('boxes').value || 0, 10),
        totalQty: parseInt(document.getElementById('totalQty').value || 0, 10),
        poNumber: document.getElementById('poNumber').value,
        comments: document.getElementById('comments').value
      };

      try {
        const res = await fetch(https://default6e6032895e464e26ac7c03a85420a9.a5.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/29/workflows/12cf3b58946f4d2d8ba684515081169e/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=k7gjFZwibd_fG0x8ZG7Ms1bTd5NrFPXHycbV7vmovU8, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert('Receipt logged successfully!');
          document.getElementById('receiptForm').reset();
          document.getElementById('dateTime').value = new Date().toISOString().slice(0, 16);
        } else {
          alert('Submission failed: ' + res.statusText);
        }
      } catch (err) {
        alert('Network error: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
